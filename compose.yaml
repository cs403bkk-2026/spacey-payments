services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spacey
      POSTGRES_PASSWORD: spacey
      POSTGRES_DB: spacey
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      APP_REVISION: compose
      DATABASE_URL: postgresql://spacey:spacey@db:5432/spacey
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  db-data:
